/* Foroom Trigger Map: drag nodes, pan/zoom the canvas, click a node to edit it.
   Self-contained: React + Tailwind + lucide-react only (no React Flow needed). */

const W = 244;
const H = (n) => (n.form || n.img ? 208 : 104);

const TYPES = {
  trigger: { label: "Trigger", icon: Zap, c: "#0d9488" },
  email: { label: "Email action", icon: Mail, c: "#4f46e5" },
  decision: { label: "Decision", icon: GitBranch, c: "#d97706" },
  delay: { label: "Wait / delay", icon: Clock, c: "#7c3aed" },
  list: { label: "List action", icon: ListPlus, c: "#16a34a" },
  bypass: { label: "Comment", icon: MessageSquare, c: "#64748b" },
};
const MENU = ["trigger", "email", "decision", "delay", "list", "bypass"];
const STATUS = {
  active: { t: "Active", c: "#16a34a" },
  todo: { t: "ToDo", c: "#2563eb" },
  pause: { t: "Pause", c: "#ea580c" },
};
const normStatus = (k) => (STATUS[k] ? k : { draft: "todo", rule: "active" }[k] || "active");
const okUrl = (u) => /^https?:\/\//i.test((u || "").trim());
const emailUrl = (n) => (n.url ?? (okUrl(n.body) ? n.body.trim() : ""));
const GUARD = "Global limit: Confirmation DOI letter must be sent to a specific email ONLY ONCE across all sequences.";
const THEME = {
  light: { "--bg": "#f4f5f7", "--panel": "#ffffff", "--ink": "#151a23", "--mute": "#667085", "--line": "#dfe3ea" },
  dark: { "--bg": "#0e1117", "--panel": "#171b24", "--ink": "#e8ebf2", "--mute": "#8d95a8", "--line": "#2a3040" },
};

function buildFlow(p, ox, o) {
  const n = (id, type, x, y, title, extra = {}) => ({
    id: p + id, type, x: ox + x, y, title, desc: "", status: "active", ...extra,
  });
  const e = (a, b, label = "") => ({ id: `${p}${a}-${b}`, from: p + a, to: p + b, label });
  return {
    nodes: [
      n("t", "trigger", 260, 0, o.tt, { form: o.form, desc: o.td }),
      n("d", "decision", 260, 250, "Is user new AND email unconfirmed?", {
        desc: "Checks the contact record before any DOI email goes out.",
        rule: "user.isNew && !user.emailConfirmed", yes: "YES", no: "NO",
      }),
      n("e1", "email", 0, 410, o.doi, {
        status: "rule", guard: true, subject: o.sub, body: o.body,
        desc: "Sent once per email address, across every sequence.",
      }),
      n("w", "delay", 0, 540, "Wait: user clicks “Confirm”", { rule: "clicked(confirm_link) within 72h" }),
      n("e2", "email", 0, 670, "Send “Welcome to Foroom”", {
        subject: "Welcome to Foroom", body: "Thanks for confirming. Here is what you can do next on Foroom.",
      }),
      n("s", "bypass", 520, 410, "Skip DOI: already registered and confirmed", {
        desc: "No confirmation email. Goes straight to the shared action.",
      }),
      n("l", "list", 260, 830, o.list, { desc: "Both branches converge here." }),
    ],
    edges: [
      e("t", "d"), e("d", "e1", "YES"), e("d", "s", "NO"), e("e1", "w"),
      e("w", "e2", "clicked"), e("e2", "l"), e("s", "l"),
    ],
    labels: [
      { x: ox, y: -130, text: o.heading },
      { x: ox, y: -92, text: GUARD, guard: true },
    ],
  };
}

const f1 = buildFlow("a", 0, {
  heading: "Flow 1: Double opt-in newsletter",
  tt: "A1 · Footer newsletter form", form: "footer",
  td: "User enters an email in the site footer.",
  doi: "Send “Confirm your subscription (DOI)”",

const f2 = buildFlow("b", 1120, {

  tt: "A2 · Registration form", form: "register",
  td: "User completes registration on the website.",
  doi: "Send “Confirm your Account (DOI)”",
  sub: "Confirm your Foroom account",
  body: "Welcome aboard! Confirm your email address to activate your account.",
  list: "Add to contact list: “Registered Users”",

const INIT = {
  nodes: [...f1.nodes, ...f2.nodes],
  edges: [...f1.edges, ...f2.edges],
  labels: [...f1.labels, ...f2.labels],
};

    {["Name", "Email", "Password"].map((x) => (

const input =
  "w-full rounded-lg border border-[var(--line)] bg-[var(--bg)] px-3 py-2 text-sm text-[var(--ink)] outline-none focus:border-teal-600";
const Field = ({ l, children }) => (

const HEAD = "<!DOCTYPE html>\n<html lang=\"uk\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Foroom \u00b7 Trigger Map<\/title>\n<script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js\"><\/script>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nhtml,body,#root{height:100%;margin:0}\nbody{background:#f4f5f7;font-family:Inter,system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\n@media (prefers-color-scheme: dark){body{background:#0e1117}}\n<\/style><\/head>\n";
const SAVED = (() => { try { return JSON.parse(document.getElementById("map-state").textContent); } catch (e) { return null; } })();
const buildDoc = (state) => {
  const src = document.getElementById("app-src").textContent;
  const j = JSON.stringify(state).replace(/</g, "\\u003c");
  return HEAD + '<body><div id="root"></div>\n<script type="application/json" id="map-state">' + j + '<\/script>\n<script type="text/babel" id="app-src">' + src + '<\/script></body></html>';
};
const toDataUrl = (file) => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onerror = () => rej(new Error("read"));
  fr.onload = () => {
    const im = new Image();
    im.onerror = () => rej(new Error("decode"));
    im.onload = () => {
      const k = Math.min(1, 1200 / im.width), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.85));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
});

function WorkflowBuilder() {
  const [dark, setDark] = useState(() => !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches));
  useEffect(() => { document.body.style.background = dark ? "#0e1117" : "#f4f5f7"; }, [dark]);
  const [nodes, setNodes] = useState(SAVED?.nodes || INIT.nodes);
  const [edges, setEdges] = useState(SAVED?.edges || INIT.edges);
  const [labels, setLabels] = useState(SAVED?.labels || INIT.labels);
  const [sel, setSel] = useState(null);
  const [menu, setMenu] = useState(false);
  const [preview, setPreview] = useState("");
  const [view, setView] = useState({ x: 0, y: 0, z: 0.5 });
  const box = useRef(null);
  const drag = useRef(null);
  const seq = useRef(1);
  const [canEdit, setCanEdit] = useState(false);
  const [canSave, setCanSave] = useState(false);
  const [saving, setSaving] = useState(false);
  const [unsaved, setUnsaved] = useState(false);
  const [saveMsg, setSaveMsg] = useState("");
  const [imgBusy, setImgBusy] = useState(false);
  const [imgErr, setImgErr] = useState("");
  const dirty = useRef(false);
  const touch = () => { dirty.current = true; setUnsaved(true); };

  const uploadImg = async (file, n) => {
    if (!file || !n) return;
    setImgErr("");
    if (!file.type.startsWith("image/")) return setImgErr("Choose an image file.");
    setImgBusy(true);
    try { upd(n.id, { img: await toDataUrl(file) }); }
    catch (e) { setImgErr("Couldn't read this image. Try a PNG or JPG."); }
    setImgBusy(false);
  };
  const removeImg = (n) => upd(n.id, { img: "" });
  const setLabel = (i, text) => { touch(); setLabels((ls) => ls.map((l, k) => (k === i ? { ...l, text } : l))); };

  useEffect(() => {
    const h = (e) => {
      const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/"));
      const n = nodes.find((x) => x.id === sel);
      if (f && n && canEdit) { e.preventDefault(); uploadImg(f, n); }
    };
    window.addEventListener("paste", h);
    return () => window.removeEventListener("paste", h);
  }, [sel, canEdit, nodes]);

  useEffect(() => {
    (async () => {
      try {
        if (!window.claude) return;
        const user = await claude.use("user");
        const art = await claude.use("artifact");
        if (user && art) { setCanEdit(true); setCanSave(true); }
      } catch (e) {}
    })();
  }, []);

  const save = async () => {
    setSaving(true); setSaveMsg("");
    try {
      const art = await claude.use("artifact");
      if (!art) throw { code: "not_granted" };
      await art.publish(buildDoc({ nodes, edges, labels }));
    } catch (e) {
      if (e && e.code === "conflict") return;
      if (e && (e.code === "not_writer" || e.code === "not_granted")) { setCanEdit(false); setSaveMsg("You can't save here: view only."); }
      else if (e && e.code === "capability_disabled") setSaveMsg("Saving is unavailable on this link. Open the page from your claude.ai library.");
      else setSaveMsg("Couldn't save. Try again.");
    }
    setSaving(false);
  };

  const byId = useMemo(() => Object.fromEntries(nodes.map((n) => [n.id, n])), [nodes]);
  const cur = sel ? byId[sel] : null;
  const upd = (id, p) => { if (!canEdit) return; touch(); setNodes((ns) => ns.map((n) => (n.id === id ? { ...n, ...p } : n))); };

  const fit = useCallback(() => {
    const el = box.current;
    if (!el || !nodes.length) return;
    const cw = el.clientWidth, ch = el.clientHeight;
    const minX = Math.min(...nodes.map((n) => n.x));
    const maxX = Math.max(...nodes.map((n) => n.x + W));
    const minY = Math.min(...nodes.map((n) => n.y), 0) - 140;
    const maxY = Math.max(...nodes.map((n) => n.y + H(n)));
    const z = Math.min(1, cw / (maxX - minX + 80), ch / (maxY - minY + 60));
    setView({ z, x: (cw - (maxX - minX) * z) / 2 - minX * z, y: 24 - minY * z });
  }, [nodes]);

  useEffect(() => { fit(); }, []); // eslint-disable-line

  useEffect(() => {
    const el = box.current;
    const h = (e) => {
      e.preventDefault();
      const r = el.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      setView((v) => {
        const z = Math.min(1.6, Math.max(0.25, v.z * (e.deltaY < 0 ? 1.1 : 0.9)));
        const k = z / v.z;
        return { z, x: px - (px - v.x) * k, y: py - (py - v.y) * k };
      });
    };
    el.addEventListener("wheel", h, { passive: false });
    return () => el.removeEventListener("wheel", h);
  }, []);

  const zoomBy = (f) =>
    setView((v) => {
      const el = box.current, px = el.clientWidth / 2, py = el.clientHeight / 2;
      const z = Math.min(1.6, Math.max(0.25, v.z * f)), k = z / v.z;
      return { z, x: px - (px - v.x) * k, y: py - (py - v.y) * k };
    });

  const downBg = (e) => {
    drag.current = { k: "p", sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
    setSel(null);
    setMenu(false);
  };
  const downNode = (e, n) => {
    e.stopPropagation();
    e.currentTarget.setPointerCapture(e.pointerId);
    if (canEdit) drag.current = { k: "n", id: n.id, sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y };
    setSel(n.id);
    setMenu(false);
  };
  const move = (e) => {
    const d = drag.current;
    if (!d) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if (d.k === "n") upd(d.id, { x: d.ox + dx / view.z, y: d.oy + dy / view.z });
    else setView((v) => ({ ...v, x: d.ox + dx, y: d.oy + dy }));
  };

  const addNode = (type) => {
    if (!canEdit) return;
    touch();
    const el = box.current;
    const id = "n" + seq.current++;
    const T = TYPES[type];
    const jitter = (seq.current % 5) * 18;
    const x = (el.clientWidth / 2 - view.x) / view.z - W / 2 + jitter;
    const y = (el.clientHeight / 2 - view.y) / view.z - 50 + jitter;
    const base = { id, type, x, y, status: "todo", desc: "" };
    const extra = {
      trigger: { title: "New trigger", desc: "When does this journey start?" },
      email: { title: "Send email", subject: "Subject line", body: "Write the message body here." },
      decision: { title: "New condition", rule: "user.property == value", yes: "YES", no: "NO" },
      delay: { title: "Wait", rule: "after 1 day" },
      list: { title: "Add to contact list" },
      bypass: { title: "Comment", desc: "Write a note for the team." },
    }[type];
    setNodes((ns) => [...ns, { ...base, ...extra }]);
    setSel(id);
    setMenu(false);
  };

  const removeNode = (id) => {
    if (!canEdit) return;
    touch();
    setNodes((ns) => ns.filter((n) => n.id !== id));
    setEdges((es) => es.filter((e) => e.from !== id && e.to !== id));
    setSel(null);
  };
  const connect = (from, to) => {
    if (!canEdit || !to || from === to || edges.some((e) => e.from === from && e.to === to)) return;
    touch();
    const n = byId[from];
    const outs = edges.filter((e) => e.from === from).length;
    const label = n.type === "decision" ? (outs === 0 ? n.yes : n.no) : "";
    setEdges((es) => [...es, { id: `${from}-${to}-${Date.now()}`, from, to, label }]);
  };

  const edgePath = (a, b) => {
    const x1 = a.x + W / 2, y1 = a.y + H(a), x2 = b.x + W / 2, y2 = b.y;
    const m = Math.max(40, Math.abs(y2 - y1) / 2);
    return { d: `M${x1} ${y1}C${x1} ${y1 + m} ${x2} ${y2 - m} ${x2} ${y2}`, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
  };

  const card = (n) => {
    const T = TYPES[n.type], I = T.icon, s = STATUS[normStatus(n.status)], on = sel === n.id;
    const sub = n.subject ? `Subject: ${n.subject}` : n.rule || n.desc;
    return (
      <div
        key={n.id}
        onPointerDown={(e) => downNode(e, n)}
        style={{
          left: n.x, top: n.y, width: W, height: H(n), borderTopColor: T.c,
          boxShadow: on ? `0 0 0 3px ${T.c}40` : "0 1px 2px rgba(0,0,0,.06)",
        }}
        className="absolute cursor-grab select-none rounded-xl border border-t-4 border-[var(--line)] bg-[var(--panel)] p-2.5 active:cursor-grabbing"
      >
        <div className="flex items-center gap-1.5">
          <I size={14} style={{ color: T.c }} />
          <span className="text-[11px] font-medium text-[var(--mute)]">{T.label}</span>
          {n.guard && <ShieldCheck size={13} className="text-amber-500" title="DOI sent once per email" />}
          <span className="ml-auto flex items-center gap-1 text-[10px] font-medium" style={{ color: s.c }}>
            <span className="h-1.5 w-1.5 rounded-full" style={{ background: s.c }} />
            {s.t}
          </span>
        </div>
        <div className="mt-1.5 line-clamp-2 text-[13px] font-semibold leading-[17px] text-[var(--ink)]">{n.title}</div>
        {n.img ? (
          <img src={n.img} alt="" draggable={false} className="pointer-events-none mt-2 h-[110px] w-full rounded-lg border border-[var(--line)] bg-[var(--bg)] object-contain" />
        ) : n.form ? (
          <div className="mt-2">{n.form === "footer" ? <FooterForm /> : <RegisterForm />}</div>
        ) : (
          <div className="mt-1 truncate text-[11px] text-[var(--mute)]">{sub}</div>
        )}
      </div>
    );
  };

  const outs = cur ? edges.filter((e) => e.from === cur.id) : [];

  return (
    <div style={THEME[dark ? "dark" : "light"]} className="relative flex h-full min-h-[640px] w-full flex-col overflow-hidden bg-[var(--bg)] text-[var(--ink)]">
      {/* Toolbar */}
      <div className="z-30 flex items-center gap-3 border-b border-[var(--line)] bg-[var(--panel)] px-4 py-2.5">
        <div className="mr-2">
          <div className="text-sm font-semibold leading-tight">Trigger map</div>
          <div className="text-[11px] text-[var(--mute)]">foroom.com.ua · email automation</div>
        </div>
        <div className={"relative " + (canEdit ? "" : "hidden")}>
          <button onClick={() => setMenu((m) => !m)} className="flex items-center gap-1.5 rounded-lg bg-teal-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-teal-700">
            <Plus size={15} /> Add block
          </button>
          {menu && (
            <div className="absolute left-0 top-full z-40 mt-1 w-48 rounded-xl border border-[var(--line)] bg-[var(--panel)] p-1 shadow-lg">
              {MENU.map((t) => {
                const I = TYPES[t].icon;
                return (
                  <button key={t} onClick={() => addNode(t)} className="flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-left text-sm hover:bg-[var(--bg)]">
                    <I size={15} style={{ color: TYPES[t].c }} /> {TYPES[t].label}
                  </button>
                );
              })}
            </div>
          )}
        </div>
        <div className="ml-auto flex items-center gap-3">
          {saveMsg && <span className="max-w-[260px] text-[11px] text-red-500">{saveMsg}</span>}
          {canEdit && canSave && <button onClick={save} disabled={!unsaved || saving} className="rounded-lg bg-teal-600 px-3 py-1.5 text-xs font-medium text-white disabled:opacity-40">{saving ? "Saving…" : unsaved ? "Save changes" : "Saved"}</button>}
          <span className="rounded-full px-2.5 py-1 text-[11px] font-medium" style={{ background: canEdit ? "#16a34a22" : "#94a3b822", color: canEdit ? "#16a34a" : "var(--mute)" }}>{canEdit ? "Can edit" : "View only"}</span>
        </div>
        <div className="flex items-center gap-1">
          {[[ZoomOut, () => zoomBy(0.85), "Zoom out"], [ZoomIn, () => zoomBy(1.15), "Zoom in"], [Maximize2, fit, "Fit to screen"]].map(([I, fn, t]) => (
            <button key={t} title={t} aria-label={t} onClick={fn} className="rounded-lg p-2 text-[var(--mute)] hover:bg-[var(--bg)] hover:text-[var(--ink)]">
              <I size={16} />
            </button>
          ))}
          <button aria-label="Toggle theme" onClick={() => setDark((d) => !d)} className="rounded-lg p-2 text-[var(--mute)] hover:bg-[var(--bg)] hover:text-[var(--ink)]">
            {dark ? <Sun size={16} /> : <Moon size={16} />}
          </button>
        </div>
      </div>

      {/* Canvas */}
      <div
        ref={box}
        onPointerDown={downBg}
        onPointerMove={move}
        onPointerUp={() => (drag.current = null)}
        className="relative flex-1 cursor-move overflow-hidden"
        style={{
          backgroundImage: "radial-gradient(var(--line) 1.2px, transparent 1.2px)",
          backgroundSize: `${24 * view.z}px ${24 * view.z}px`,
          backgroundPosition: `${view.x}px ${view.y}px`,
          touchAction: "none",
        }}
      >
        <div style={{ transform: `translate(${view.x}px,${view.y}px) scale(${view.z})`, transformOrigin: "0 0" }} className="absolute left-0 top-0">
          <svg className="pointer-events-none absolute left-0 top-0 overflow-visible" width="1" height="1">
            <defs>
              <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M0 1L9 5L0 9z" style={{ fill: "var(--mute)" }} />
              </marker>
            </defs>
            {edges.map((ed) => {
              const a = byId[ed.from], b = byId[ed.to];
              if (!a || !b) return null;
              const p = edgePath(a, b);
              const col = ed.label === "YES" ? "#16a34a" : ed.label === "NO" ? "#dc2626" : "var(--mute)";
              return (
                <g key={ed.id}>
                  <path d={p.d} fill="none" strokeWidth="1.6" markerEnd="url(#ah)" style={{ stroke: col }} />
                  {ed.label && (
                    <g transform={`translate(${p.mx},${p.my})`}>
                      <rect x={-5 - ed.label.length * 3.4} y="-9" rx="9" height="18" width={10 + ed.label.length * 6.8} style={{ fill: "var(--panel)", stroke: col }} />
                      <text textAnchor="middle" y="4" fontSize="10" fontWeight="600" style={{ fill: col }}>{ed.label}</text>
                    </g>
                  )}
                </g>
              );
            })}
          </svg>

          {labels.map((l, i) =>
            l.guard ? (
              <div key={i} style={{ left: l.x, top: l.y, width: 760 }} className="absolute flex items-start gap-2 rounded-lg border border-amber-400/60 bg-amber-400/15 px-3 py-2 text-xs font-medium">
                <ShieldCheck size={15} className="mt-0.5 shrink-0" style={{ color: dark ? "#fcd34d" : "#92400e" }} />
                {canEdit ? (
                  <textarea rows={2} value={l.text} onPointerDown={(e) => e.stopPropagation()} onChange={(e) => setLabel(i, e.target.value)} className="w-full resize-none bg-transparent outline-none" style={{ color: dark ? "#fcd34d" : "#92400e" }} />
                ) : (
                  <span style={{ color: dark ? "#fcd34d" : "#92400e" }}>{l.text}</span>
                )}
              </div>
            ) : canEdit ? (
              <input key={i} value={l.text} onPointerDown={(e) => e.stopPropagation()} onChange={(e) => setLabel(i, e.target.value)} style={{ left: l.x, top: l.y, width: 640 }} className="absolute rounded bg-transparent text-lg font-semibold text-[var(--ink)] outline-none hover:ring-1 hover:ring-[var(--line)] focus:ring-1 focus:ring-teal-600" />
            ) : (
              <div key={i} style={{ left: l.x, top: l.y }} className="absolute whitespace-nowrap text-lg font-semibold">{l.text}</div>
            )
          )}

          {nodes.map(card)}
        </div>
        {!nodes.length && <div className="absolute inset-0 grid place-items-center text-sm text-[var(--mute)]">Empty map. Use “Add block” to start.</div>}
      </div>

      {/* Slide-over editor */}
      <aside
        className={`absolute bottom-0 right-0 top-[57px] z-30 w-[380px] max-w-full overflow-y-auto border-l border-[var(--line)] bg-[var(--panel)] shadow-2xl transition-transform duration-200 ${cur ? "translate-x-0" : "translate-x-full"}`}
      >
        {cur && (
          <div className="space-y-4 p-5">
            <div className="flex items-center gap-2">
              {React.createElement(TYPES[cur.type].icon, { size: 16, style: { color: TYPES[cur.type].c } })}
              <span className="text-sm font-semibold">{TYPES[cur.type].label}</span>
              <button aria-label="Close editor" onClick={() => setSel(null)} className="ml-auto rounded-lg p-1.5 text-[var(--mute)] hover:bg-[var(--bg)]"><X size={16} /></button>
            </div>

            <fieldset disabled={!canEdit} className="m-0 min-w-0 space-y-4 border-0 p-0">
            <Field l="Block title">
              <input className={input} value={cur.title} onChange={(e) => upd(cur.id, { title: e.target.value })} />
            </Field>

            <div>
              <span className="mb-1 block text-xs font-medium text-[var(--mute)]">Status</span>
              <div className="grid grid-cols-3 gap-1 rounded-lg bg-[var(--bg)] p-1">
                {Object.entries(STATUS).map(([k, s]) => (
                  <button key={k} onClick={() => upd(cur.id, { status: k })}
                    className={`rounded-md py-1.5 text-xs font-medium ${normStatus(cur.status) === k ? "bg-[var(--panel)] shadow-sm" : "text-[var(--mute)]"}`}
                    style={normStatus(cur.status) === k ? { color: s.c } : undefined}>
                    {s.t}
                  </button>
                ))}
              </div>
            </div>

            <Field l="Description / notes">
              <textarea rows={3} className={input} value={cur.desc || ""} onChange={(e) => upd(cur.id, { desc: e.target.value })} />
            </Field>

            <div>
              <span className="mb-1 block text-xs font-medium text-[var(--mute)]">Screenshot / image</span>
              {cur.img && <img src={cur.img} alt="" className="mb-2 max-h-56 w-full rounded-lg border border-[var(--line)] bg-[var(--bg)] object-contain" />}
              {canEdit && (
                <div className="flex items-center gap-2">
                  <label className="cursor-pointer rounded-lg border border-[var(--line)] px-3 py-1.5 text-xs font-medium hover:bg-[var(--bg)]">
                    {imgBusy ? "Uploading…" : cur.img ? "Replace image" : "Upload image"}
                    <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" className="hidden" onChange={(e) => { uploadImg(e.target.files[0], cur); e.target.value = ""; }} />
                  </label>
                  {cur.img && <button onClick={() => removeImg(cur)} className="rounded-lg border border-[var(--line)] px-3 py-1.5 text-xs text-red-500 hover:bg-red-500/10">Remove</button>}
                  <span className="text-[11px] text-[var(--mute)]">or paste with Ctrl/Cmd+V. Save to publish.</span>
                </div>
              )}
              {imgErr && <p className="mt-1 text-xs text-red-500">{imgErr}</p>}
            </div>

            {cur.type === "email" && (
              <div className="space-y-3">
                <Field l="Email subject line">
                  <input className={input} value={cur.subject || ""} onChange={(e) => upd(cur.id, { subject: e.target.value })} />
                </Field>
                <Field l="Email URL (link to the email)">
                  <input type="url" placeholder="https://…" className={input} value={emailUrl(cur)} onChange={(e) => upd(cur.id, { url: e.target.value })} />
                </Field>
                <div className="rounded-xl border border-[var(--line)] bg-[var(--bg)] p-3">
                  <div className="text-[11px] text-[var(--mute)]">From: Foroom &lt;hello@foroom.com.ua&gt;</div>
                  <div className="mt-1 text-sm font-semibold">{cur.subject || "(no subject)"}</div>
                  {okUrl(emailUrl(cur)) ? (
                    <div className="mt-3 flex gap-2">
                      <div role="button" tabIndex={0} onClick={() => setPreview(emailUrl(cur).trim())} onKeyDown={(e) => e.key === "Enter" && setPreview(emailUrl(cur).trim())} className="cursor-pointer rounded-lg bg-teal-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-teal-700">Open email</div>
                      <a href={emailUrl(cur).trim()} target="_blank" rel="noopener noreferrer" className="rounded-lg border border-[var(--line)] px-3 py-1.5 text-xs font-medium hover:bg-[var(--panel)]">New tab</a>
                    </div>
                  ) : (
                    <p className="mt-2 text-[13px] text-[var(--mute)]">Paste the email link above to preview it here.</p>
                  )}
                </div>
                <label className="flex items-start gap-2 text-xs text-[var(--mute)]">
                  <input type="checkbox" className="mt-0.5" checked={!!cur.guard} onChange={(e) => upd(cur.id, { guard: e.target.checked })} />
                  <span>DOI guard: send only once per email address across all sequences</span>
                </label>
              </div>
            )}

            {(cur.type === "decision" || cur.type === "delay") && (
              <div className="space-y-3">
                <Field l={cur.type === "decision" ? "Condition rule" : "Wait until / for"}>
                  <input className={`${input} font-mono text-xs`} value={cur.rule || ""} onChange={(e) => upd(cur.id, { rule: e.target.value })} />
                </Field>
                {cur.type === "decision" && (
                  <div className="grid grid-cols-2 gap-2">
                    <Field l="Yes branch label"><input className={input} value={cur.yes} onChange={(e) => upd(cur.id, { yes: e.target.value })} /></Field>
                    <Field l="No branch label"><input className={input} value={cur.no} onChange={(e) => upd(cur.id, { no: e.target.value })} /></Field>
                  </div>
                )}
              </div>
            )}

            <div>
              <span className="mb-1 flex items-center gap-1 text-xs font-medium text-[var(--mute)]"><Link2 size={12} /> Next blocks</span>
              <div className="space-y-1.5">
                {outs.map((ed) => (
                  <div key={ed.id} className="flex items-center gap-1.5">
                    <input
                      className={`${input} !w-20 !px-2 !py-1 text-xs`} placeholder="label" value={ed.label}
                      onChange={(e) => { touch(); setEdges((es) => es.map((x) => (x.id === ed.id ? { ...x, label: e.target.value } : x))); }}
                    />
                    <span className="flex-1 truncate text-xs">{byId[ed.to]?.title}</span>
                    <button aria-label="Remove connection" onClick={() => { touch(); setEdges((es) => es.filter((x) => x.id !== ed.id)); }} className="p-1 text-[var(--mute)] hover:text-red-500"><X size={13} /></button>
                  </div>
                ))}
                <select className={`${input} text-xs`} value="" onChange={(e) => connect(cur.id, e.target.value)}>
                  <option value="">Connect to another block…</option>
                  {nodes.filter((n) => n.id !== cur.id).map((n) => <option key={n.id} value={n.id}>{n.title}</option>)}
                </select>
              </div>
            </div>

            {canEdit && (
            <button onClick={() => removeNode(cur.id)} className="flex w-full items-center justify-center gap-1.5 rounded-lg border border-red-500/40 py-2 text-sm font-medium text-red-500 hover:bg-red-500/10">
              <Trash2 size={14} /> Delete block
            </button>
            )}
            </fieldset>
          </div>
        )}
      </aside>

      {preview && (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={() => setPreview("")}>
          <div className="flex h-full max-h-[760px] w-full max-w-[720px] flex-col overflow-hidden rounded-2xl bg-[var(--panel)] shadow-2xl" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center gap-3 border-b border-[var(--line)] px-4 py-2.5">
              <span className="text-sm font-semibold">Email preview</span>
              <span className="min-w-0 flex-1 truncate text-[11px] text-[var(--mute)]">If it doesn't load here, open it in a new tab.</span>
              <a href={preview} target="_blank" rel="noopener noreferrer" className="rounded-lg border border-[var(--line)] px-2.5 py-1 text-xs font-medium hover:bg-[var(--bg)]">New tab</a>
              <button aria-label="Close preview" onClick={() => setPreview("")} className="rounded-lg p-1.5 text-[var(--mute)] hover:bg-[var(--bg)]"><X size={16} /></button>
            </div>
            <iframe src={preview} title="Email preview" className="w-full flex-1 bg-white" sandbox="allow-scripts allow-same-origin allow-popups" />
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<WorkflowBuilder/>);

</script></body></html>
